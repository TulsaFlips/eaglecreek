<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eagle Creek</title>
<meta name="description" content="Eagle Creek in the field: projects, photos, daily logs, punch lists, schedules, documents and the calendar, synced with the Mac app.">
<meta name="theme-color" content="#F2EDE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eagle Creek">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
  // Light, Dark or match the device, chosen in Settings (Light by default, like the Mac app).
  (function () {
    var choice = 'light';
    try { choice = localStorage.getItem('ec-theme') || 'light'; } catch (e) {}
    var dark = choice === 'dark' || (choice === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#1B1916' : '#F2EDE3');
  })();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="main"><div class="loading">Loading…</div></main>
  <nav class="tabs" id="tabs" aria-label="Screens"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="picker" hidden>
<script src="app.js"></script>
<script src="plans.js"></script>
<script src="contacts.js"></script>
</body>
</html>
