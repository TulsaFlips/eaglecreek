<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Claude · Eagle Creek</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<!-- This page talks only to the Eagle Creek Supabase project, and keeps the sign-in in memory. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
<link rel="icon" href="icon-32.png" sizes="32x32">
<style>
  :root {
    --page: #F2EDE3; --card: #FBF9F4; --text: #2B241D; --muted: #74695C; --forest: #2E5E3E; --forest-text: #FBF9F4;
    --stroke: rgba(134, 86, 47, .16); --field: #FFFFFF; --warn-bg: #F7E7D2; --warn-text: #7A3F12; --bad: #9B2C1F;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #1C1915; --card: #26221D; --text: #EFE8DC; --muted: #A99D8C; --forest: #7DB58E; --forest-text: #13241A;
      --stroke: rgba(239, 232, 220, .12); --field: #1F1C18; --warn-bg: #3A2A1A; --warn-text: #F0C79A; --bad: #F08A7A;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 40px 16px 48px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .brand span { font-family: ui-serif, "New York", Georgia, serif; font-size: 20px; }
  .card { background: var(--card); border: 1px solid var(--stroke); border-radius: 12px; padding: 22px 22px 20px; }
  h1 { font-family: ui-serif, "New York", Georgia, serif; font-size: 25px; line-height: 1.25; margin: 0 0 8px; font-weight: 600; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--stroke); border-radius: 8px; background: var(--field); color: var(--text); }
  input:focus { outline: 2px solid var(--forest); outline-offset: 1px; }
  .buttons { display: flex; gap: 10px; margin-top: 18px; }
  button { flex: 1; font: inherit; font-weight: 600; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--stroke); background: transparent; color: var(--text); cursor: pointer; }
  button.primary { background: var(--forest); border-color: var(--forest); color: var(--forest-text); }
  button:disabled { opacity: .55; cursor: default; }
  .error { color: var(--bad); font-size: 14px; margin: 12px 0 0; }
  .warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 12px 0; }
  dl { margin: 14px 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  ul.access { list-style: none; padding: 0; margin: 8px 0 14px; border-top: 1px solid var(--stroke); }
  ul.access li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--stroke); font-size: 15px; }
  ul.access li span:last-child { color: var(--muted); white-space: nowrap; }
  .foot { text-align: center; margin-top: 16px; }
  a { color: var(--forest); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="icon-192.png" alt=""><span>Eagle Creek</span></div>
  <div class="card" id="card">
    <noscript><p>This page needs JavaScript.</p></noscript>
    <p class="muted" id="loading">Loading…</p>
  </div>
  <p class="muted foot">Claude's access is set in Eagle Creek › Settings › Team, and can be turned off there at any time.</p>
</main>
<script src="config.js"></script>
<script src="connect.js"></script>
</body>
</html>
